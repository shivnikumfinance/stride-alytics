name: Database Backup

# Free Supabase projects have no managed backups, so dump the database on a
# schedule. The dump contains your trades, so it is ENCRYPTED before upload
# (artifacts on a public repo are readable by anyone with a GitHub login).
#
# Required repo secrets:
#   BACKUP_DATABASE_URL  Postgres connection string (Supabase: Project Settings > Database)
#   BACKUP_PASSPHRASE    long random passphrase used to encrypt the dump (store it somewhere safe;
#                        without it the backup cannot be restored)
#
# Restore:  gpg --decrypt stridealytics-YYYY-MM-DD.sql.gz.gpg | gunzip | psql "$DATABASE_URL"

on:
  schedule:
    - cron: "0 6 * * 0"  # weekly, Sunday 06:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "${BACKUP_DATABASE_URL}" ] || [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "BACKUP_DATABASE_URL and BACKUP_PASSPHRASE secrets are required" >&2
            exit 1
          fi

      # pg_dump must be at least as new as the server, and the runner's default
      # client can be older than Supabase's Postgres, so install a current client.
      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          out="stridealytics-$(date -u +%F).sql.gz.gpg"
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges --schema=public "${BACKUP_DATABASE_URL}" \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "${BACKUP_PASSPHRASE}" -o "${out}"
          test -s "${out}"
          ls -l "${out}"
          echo "BACKUP_FILE=${out}" >> "$GITHUB_ENV"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
