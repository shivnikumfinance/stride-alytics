name: Generate Market Regime

# Records the daily regime score after the US close and alerts on a state change.
# Cron is UTC: 21:30 is after the close both in winter (16:30 ET) and summer (17:30 ET).
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

jobs:
  generate:
    uses: ./.github/workflows/reusable-python-task.yml
    with:
      script_name: generate_regime
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
