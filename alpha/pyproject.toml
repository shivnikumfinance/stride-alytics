[project]
name = "stride-alytics-alpha"
version = "0.1.0"
description = "StrideAlytics Alpha — Option Trading System pipeline"

requires-python = ">=3.11,<3.13"

dependencies = [
    "pandas>=2.2.3,<3",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "gspread>=6.1.0",
    "google-auth>=2.29.0",
    "yfinance>=1.4.1",
    "requests>=2.31.0",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.9.0",
    "black>=25.1.0",
    "mypy>=1.13.0",
]

# Alpha developer-experience scripts — discoverable as `uv run lint`,
# `uv run format`, `uv run typecheck`, `uv run test`, `uv run verify`.
[project.scripts]
alpha = "app.main:main"
lint = "scripts.lint:main"
format = "scripts.format:main"
typecheck = "scripts.typecheck:main"
test = "scripts.test:main"
verify = "scripts.verify:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]
# Include scripts/ so [project.scripts] entry points resolve when the
# wheel is installed.
[tool.hatch.build.targets.wheel.force-include]
"scripts" = "scripts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = false
strict = true
