[project]
name = "stride-alytics-alpha"
version = "0.1.0"
description = "StrideAlytics Alpha — Option Trading System pipeline"

requires-python = ">=3.11,<3.13"

dependencies = [
    "pandas>=2.2.3,<3",
    "python-dotenv>=1.0.0",
    "supabase-py>=2.8.1",
    "gspread>=6.1.0",
    "google-auth>=2.29.0",
    "yfinance>=1.4.1",
    "requests>=2.31.0",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.9.0",
    "black>=25.1.0",
]

[project.scripts]
alpha = "app.main:run_system"
dashboard = "streamlit run app/streamlit_app.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"